services:
  # Neo4j 그래프 데이터베이스
  neo4j:
    image: neo4j:5.15
    container_name: mem0g-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mem0g-network

  # Qdrant 벡터 데이터베이스
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mem0g-qdrant
    ports:
      - "9333:6333"  # HTTP API
      - "9334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - mem0g-network

  # Ollama LLM 서버는 외부 PC에서 실행
  # OLLAMA_BASE_URL 환경변수로 외부 서버 IP 지정
  # 예: OLLAMA_BASE_URL=http://192.168.1.100:11434

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mem0g-backend
    ports:
      - "8000:8000"
    environment:
      # Ollama 역할별 분리 설정
      - OLLAMA_LLM_URL=${OLLAMA_LLM_URL:-http://192.168.68.57:11434}
      - OLLAMA_EMBEDDING_URL=${OLLAMA_EMBEDDING_URL:-http://192.168.68.57:11435}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-qwen2.5:7b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      # LM Studio / OpenAI 호환 임베딩 설정
      - USE_OPENAI_EMBEDDING=${USE_OPENAI_EMBEDDING:-false}
      - OPENAI_EMBEDDING_URL=${OPENAI_EMBEDDING_URL:-http://localhost:1234/v1}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-bge-m3}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}
      # 레거시 호환성 (설정 시 위 분리 URL 무시)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OLLAMA_HOST=${OLLAMA_BASE_URL:-}
      # 데이터베이스 설정
      - NEO4J_URL=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mem0g-network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mem0g-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - mem0g-network
    command: npm start

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local

networks:
  mem0g-network:
    driver: bridge
